# REFERENCA za prepisivanje u compose.yml (ovaj fajl docker ne cita).
# Komentari su objasnjenja - u svoj compose.yml prepisi samo ono sto ti treba.
#
# Nema "version:" kljuca na vrhu - zastareo je i moderni Docker Compose ga ignorise
# (samo ispise warning).

services:

  # ---------------------------------------------------------------- baza
  db:
    # Gotov image sa Docker Hub-a: Postgres 17 sa vec ugradjenom pgvector ekstenzijom.
    # Nista se ne gradi - samo se povlaci.
    image: pgvector/pgvector:pg17
    container_name: ayd-db

    # Cita .env iz korena projekta i prosledjuje sve varijable u kontejner.
    # Postgres image od njih koristi POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    # i na prvom pokretanju pravi tog korisnika i tu bazu.
    env_file: .env

    ports:
      # levo = port na Windows-u, desno = port u kontejneru.
      # 5433 jer lokalni Postgres vec drzi 5432. Iz pgAdmin-a: localhost:5433.
      - "5433:5432"

    volumes:
      # Named volume - OVDE zive podaci. Prezivljava "docker compose down",
      # brise se samo sa "docker compose down -v".
      - pgdata:/var/lib/postgresql/data
      # Sema. Postgres izvrsava sve .sql/.sh odavde po abecedi, ali SAMO kad je
      # data direktorijum prazan (prvo pokretanje). :ro = read-only, kontejner
      # ne moze da menja tvoje fajlove.
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # pg_isready vraca exit 0 kad baza STVARNO prima konekcije.
      # CMD-SHELL jer treba shell da razresi $$POSTGRES_USER unutar kontejnera.
      # Dva dolara ($$) - tako se u compose-u escape-uje dolar da ga NE pojede
      # compose interpolacija, nego da ga vidi shell u kontejneru.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  # ---------------------------------------------------------------- backend
  api:
    # Ovde se GRADI image, iz backend/Dockerfile.
    build: ./backend
    container_name: ayd-api
    env_file: .env

    depends_on:
      db:
        # Kljucni deo: ceka da healthcheck prodje, ne samo da kontejner krene.
        # Bez "condition: service_healthy" api startuje 2 sekunde pre baze i pukne.
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      # Bind mount: tvoj ./backend folder je ZIV unutar kontejnera.
      # Sacuvas .py fajl na Windows-u -> uvicorn --reload odmah restartuje app.
      # Bez ovoga bi morao "docker compose build api" za svaku izmenu.
      - ./backend:/app

    extra_hosts:
      # Daje kontejneru ime "host.docker.internal" koje pokazuje na tvoj Windows.
      # Tako backend iz kontejnera vidi Ollamu koja radi na hostu (port 11434).
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

  # ---------------------------------------------------------------- frontend
  web:
    # Dev rezim: ne gradi se image, samo se uzme cist node i pokrene vite.
    image: node:22-alpine
    container_name: ayd-web
    working_dir: /app

    # --host 0.0.0.0 je OBAVEZNO. Vite po defaultu slusa samo na 127.0.0.1,
    # sto unutar kontejnera znaci "samo ja sam sebe vidim" - browser na Windows-u
    # bi dobio prazan odgovor iako kontejner radi.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      # Anonimni volume PREKO montiranog foldera: cuva node_modules unutar
      # kontejnera (Linux) i ne dozvoljava da ih tvoj Windows folder pregazi.
      # Bez ovoga npm instalira Windows binarije u Linux kontejner i puca.
      - /app/node_modules

    depends_on:
      - api

# Deklaracija named volumena. Bez ovog bloka "pgdata" gore nije validan.
volumes:
  pgdata:
